<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{app}}</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1c2233; --muted: #6b7388;
    --ok: #22a06b; --err: #e5484d; --shadow: 0 10px 40px rgba(20,30,60,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1320; --card: #181d2e; --text: #eef0f7; --muted: #9aa3bb;
      --shadow: 0 10px 40px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; padding: 44px 32px;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    text-align: center; animation: rise .5s ease both;
  }
  .badge {
    width: 84px; height: 84px; margin: 0 auto 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
  }
  .ok { --accent: var(--ok); }
  .error { --accent: var(--err); }
  .badge svg { width: 44px; height: 44px; }
  .badge path {
    fill: none; stroke: currentColor; stroke-width: 3.5;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 40; stroke-dashoffset: 40;
    animation: draw .6s .3s ease forwards;
  }
  .error .icon-ok, .ok .icon-error { display: none; }
  h1 { font-size: 1.5rem; margin: 0 0 10px; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  .brand {
    margin-top: 32px; font-size: .8rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); opacity: .7;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body>
  <main class="card {{status}}">
    <div class="badge {{status}}">
      <svg class="icon-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <svg class="icon-error" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <h1>{{title}}</h1>
    <p>{{hint}}</p>
    <div class="brand">{{app}}</div>
  </main>
</body>
</html>
